# Separate, MAIN-PR-ONLY workflow: never produce this required approval on a push.
name: Robot Release Review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: release-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Verify administrator activation and release route
        env:
          CONFIGURED: ${{ vars.RELEASE_REVIEW_CONFIGURED }}
        run: |
          python3 - <<'PY'
          import json, os, re
          p = json.load(open(os.environ['GITHUB_EVENT_PATH']))['pull_request']
          assert os.environ['CONFIGURED'] == 'true', 'Admin must configure protected robot-release-review environment, then set RELEASE_REVIEW_CONFIGURED=true.'
          assert not p['draft'], 'Release must be ready for review.'
          assert p['base']['ref'] == 'main'
          assert p['head']['repo']['full_name'] == p['base']['repo']['full_name']
          assert re.fullmatch(r'(release/[a-z0-9]+(?:-[a-z0-9]+)*|hotfix/[a-z0-9-]+/[a-z0-9]+(?:-[a-z0-9]+)*)', p['head']['ref'])
          print('Release review requested for candidate', p['head']['sha'])
          PY
  hardware-review:
    needs: release-policy
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment:
      name: robot-release-review
    steps:
      - name: Record approved candidate, without checking out or deploying PR code
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'Release review passed for PR %s, head %s, candidate merge %s. No deployment performed.\n' "$PR_NUMBER" "$HEAD_SHA" "$MERGE_SHA" >> "$GITHUB_STEP_SUMMARY"
  robot-release-approval:
    name: robot-release-approval
    if: ${{ always() }}
    needs: [release-policy, hardware-review]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail if activation or protected approval failed, skipped or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          r = json.loads(os.environ['RESULTS'])
          ok = set(r) == {'release-policy', 'hardware-review'} and all(x.get('result') == 'success' for x in r.values())
          print(json.dumps(r, indent=2))
          sys.exit(0 if ok else 1)
          PY
